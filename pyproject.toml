# This repository is a Copier template, not a Python package.
# The project that gets generated lives under `template/`; everything here only
# supports developing and testing the template itself.

[project]
name = "python-project-template"
version = "0.1.0"
description = "Opinionated Copier template to kickstart a new Python project"
authors = [
    {name = "Dantos7", email = "daniel.tosone@gmail.com"},
]
maintainers = [
    {name = "Dantos7", email = "daniel.tosone@gmail.com"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.12.0"
add-bounds = "major"

[dependency-groups]
dev = [
    "copier>=9.4.0,<10.0.0",
    "prek>=0.5.2,<1.0.0",
    "poethepoet>=0.44.0,<1.0.0",
]

[tool.poe.tasks.render]
help = "Render the template into ./demo using the default answers"
# --vcs-ref=HEAD renders the working tree; without it Copier would use the latest git tag.
cmd = """copier copy --vcs-ref=HEAD --defaults --overwrite
    --data author_name='Template Demo' --data author_email='demo@example.com'
    . demo"""

[tool.poe.tasks.clean]
help = "Remove the rendered demo project"
cmd = "rm -rf demo"

[tool.poe.tasks.check]
help = "Render the template and run the generated project's own checks"
sequence = [
    { ref = "clean" },
    { ref = "render" },
    { cmd = "uv sync --project demo" },
    { cmd = "uv run --project demo ruff check demo" },
    { cmd = "uv run --project demo pytest demo/tests -q" },
    { cmd = "uv run --project demo ty check demo" },
]
